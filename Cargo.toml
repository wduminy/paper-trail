[workspace]
resolver = "2"
members = [
    "crates/pt_core",
    "crates/pt_cli", "crates/pt_ui",
]
default-members = [ "crates/pt_ui" ]


[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Willem Duminy"]

[workspace.dependencies]
pt_core = { path = "crates/pt_core" }

clap = {version = "^4.6.7",features = ["derive"]}
pdf-extract = "^0.12.1"
serde = {version="^1.0.229", features = ["derive"]}
serde_json = "^1.0.154"
thiserror = "2.0.21"

googletest = "0.14"
rstest = "^0.28.0"

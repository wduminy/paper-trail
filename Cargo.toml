[workspace]
resolver = "2"
members = [
    "crates/pt-core",
    "crates/pt-cli",
]


[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Willem Duminy <willem@bulksms.com>"]

[workspace.dependencies]
pt-core = { path = "crates/pt-core" }

clap = {version = "^4.6.7",features = ["derive"]}
pdf-extract = "^0.12.1"
serde = {version="^1.0.229", features = ["derive"]}
serde_json = "^1.0.154"
thiserror = "2.0.21"

googletest = "0.14"
rstest = "^0.28.0"
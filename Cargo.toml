[workspace]
resolver = "2"
members = [
    "crates/pt-core",
    "crates/pt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Willem Duminy <willem@bulksms.com>"]

[workspace.dependencies]
pt-core = { path = "crates/pt-core" }
rstest = "^0.28.0"
thiserror = "2.0.21"
pdf-extract = "^0.9.0"
clap = {version = "^4.6.7",features = ["derive"]}